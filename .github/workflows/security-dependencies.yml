name: Patched dependencies
on:
  push:
    paths: ['.github/workflows/security-dependencies.yml']
    branches: ['feat/mvp-v0.1']
permissions:
  contents: read
  actions: read
jobs:
  dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: sworks-dependencies
          run-id: 36095148270
          github-token: ${{ github.token }}
      - name: Upgrade development dependency to security patch
        run: |
          mkdir workspace && tar -xzf sworks-dependencies.tar.gz -C workspace
          cd workspace
          rm -rf node_modules package-lock.json
          node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.private = true; p.devDependencies.vitest = '4.1.11'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
          npm install
          npm audit --json > audit.json
          tar -czf ../sworks-patched-dependencies.tar.gz package.json package-lock.json node_modules audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: sworks-patched-dependencies
          path: sworks-patched-dependencies.tar.gz
          retention-days: 1

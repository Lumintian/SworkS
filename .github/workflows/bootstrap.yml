name: Bootstrap development dependencies
on:
  push:
    branches: [feat/mvp-workbench]
    paths: [.github/workflows/bootstrap.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm install --global npm@11
      - name: Install exact dependency set from a clean manifest
        run: |
          mkdir bootstrap
          cd bootstrap
          cat > package.json <<'JSON'
          {
            "name":"sworks","version":"0.1.0","private":true,"type":"module",
            "dependencies": {
              "@codemirror/lang-markdown":"6.5.2","@codemirror/view":"6.43.13","@hono/node-server":"1.19.17","@uiw/react-codemirror":"4.25.12",
              "better-sqlite3":"12.11.1","hono":"4.13.9","ipaddr.js":"2.5.0","katex":"0.16.47","proper-lockfile":"4.1.2",
              "react":"19.3.0","react-dom":"19.3.0","react-markdown":"10.1.0","rehype-callouts":"2.2.0","rehype-katex":"7.0.1",
              "remark-gfm":"4.0.1","remark-math":"6.0.0","remark-parse":"11.0.0","unified":"11.0.5","unist-util-visit":"5.1.0",
              "yauzl":"3.4.0","yazl":"3.3.1","zod":"4.6.5"
            },
            "devDependencies": {
              "@playwright/test":"1.63.0","@tailwindcss/vite":"4.3.3","@types/better-sqlite3":"7.6.13","@types/node":"22.20.4",
              "@types/proper-lockfile":"4.1.4","@types/react":"19.3.0","@types/react-dom":"19.3.0","@types/yauzl":"2.10.3","@types/yazl":"2.4.6",
              "@vitejs/plugin-react":"5.2.0","tailwindcss":"4.3.3","typescript":"5.9.3","vite":"7.3.6","vitest":"4.1.11"
            }
          }
          JSON
          npm install || { tail -150 /home/runner/.npm/_logs/*debug-0.log; exit 1; }
          node --version > environment.txt
          npm --version >> environment.txt
          npm ls --depth=0 >> environment.txt
          npm audit --json > npm-audit.json || true
          tar -czf ../sworks-dependencies.tgz node_modules package.json package-lock.json environment.txt npm-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: sworks-development-dependencies
          path: sworks-dependencies.tgz
          retention-days: 1
